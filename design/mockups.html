<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apfellicht Mockups</title>
<!-- Rendern: ?view=hero|compare&lang=en|de, Fenster 1600x900 (scripts/make-mockups.sh) -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; color: #f5f5f7;
         background: radial-gradient(ellipse at 30% 40%, #2a2420 0%, #121214 55%, #0b0b0c 100%); }
  .view { display: none; width: 100%; height: 100%; position: relative; }
  .view.on { display: block; }

  /* Deckel von hinten */
  .lid { position: absolute; border-radius: 34px;
         background: linear-gradient(160deg, #4a4a4f 0%, #2c2c30 45%, #1d1d20 100%);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 6px rgba(0,0,0,.6), 0 40px 80px rgba(0,0,0,.55); }
  .lid::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
                background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 40%); }
  .glow { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  h1 { font-size: 92px; letter-spacing: -2.5px; margin: 0; font-weight: 700; }
  .tag { font-size: 34px; line-height: 1.25; color: #d9d2c8; margin: 18px 0 0; font-weight: 500; letter-spacing: -.4px; }
  .points { margin: 40px 0 0; padding: 0; list-style: none; font-size: 24px; color: #bdb6ac; }
  .points li { margin: 0 0 14px; padding-left: 34px; position: relative; }
  .points li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 12px; height: 12px; border-radius: 50%;
                       background: #ffc860; box-shadow: 0 0 12px #ffb347; }
  .menu { position: absolute; border-radius: 16px; overflow: hidden;
          box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 30px 60px rgba(0,0,0,.6); }
  .menu img { display: block; width: 100%; }
  .foot { position: absolute; left: 110px; bottom: 54px; font-size: 20px; color: #8e8880; }

  /* Vergleich */
  .compare h2 { position: absolute; left: 110px; top: 70px; margin: 0; font-size: 56px; letter-spacing: -1.4px; }
  .compare .sub { position: absolute; left: 110px; top: 148px; font-size: 26px; color: #bdb6ac; }
  .panel { position: absolute; top: 220px; width: 660px; height: 620px; border-radius: 26px; padding: 36px 40px;
           background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .panel h3 { margin: 0; font-size: 30px; letter-spacing: -.5px; }
  .panel .note { margin: 8px 0 0; font-size: 21px; color: #a8a199; height: 56px; }
  .lids { display: flex; gap: 26px; margin-top: 26px; }
  .mini { position: relative; width: 180px; height: 120px; border-radius: 14px;
          background: linear-gradient(160deg, #47474c, #222226); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
  .mini .glow { width: 54px; height: 54px; }
  .mini small { position: absolute; left: 0; right: 0; bottom: -32px; text-align: center; font-size: 17px; color: #8e8880; }
  svg.chart { position: absolute; left: 40px; bottom: 30px; }
  .chart text { font: 15px -apple-system, system-ui; fill: #8e8880; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf73" stop-opacity=".9"/><stop offset=".35" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fruit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cc"/><stop offset="1" stop-color="#ffc35e"/></linearGradient>
    <symbol id="apple" viewBox="0 0 24 24">
      <path fill="url(#fruit)" d="M12 8.2C10.6 7 8.4 6.7 6.8 7.8 4.8 9.2 4.4 12.2 5.3 15 6.2 17.9 8.3 20.6 10.3 20.6c.8 0 1.1-.4 1.7-.4s.9.4 1.7.4c2 0 4.1-2.7 5-5.6.9-2.8.5-5.8-1.5-7.2-1.6-1.1-3.8-.8-5.2.4Z"/>
      <path fill="#ffd27a" d="M10.9 8.2c0-1.6.3-3 1.1-4.1l1.6 1.1c-.6.8-.8 1.8-.8 3Z"/>
      <path fill="#ffe09a" d="M12.9 5.6c.6-1.6 2.2-2.5 3.9-2.3-.3 1.7-1.9 2.7-3.9 2.3Z"/>
    </symbol>
  </defs>
</svg>

<!-- Titelbild -->
<section class="view" id="hero">
  <div style="position:absolute; left:110px; top:150px; width:700px">
    <h1>Apfellicht</h1>
    <p class="tag" data-en="The glowing logo on your MacBook Pro,<br>at the brightness <em>you</em> choose."
                   data-de="Das leuchtende Logo deines MacBook Pro,<br>so hell, wie <em>du</em> es willst."></p>
    <ul class="points">
      <li data-en="Fixed brightness, independent of your display" data-de="Feste Helligkeit, unabhängig vom Display"></li>
      <li data-en="Full brightness, even with a dim screen" data-de="Volle Helligkeit, auch bei dunklem Display"></li>
      <li data-en="Keyboard backlight with its own slider" data-de="Tastaturlicht mit eigenem Regler"></li>
      <li data-en="Menu bar + Control Center · free &amp; open source" data-de="Menüleiste + Kontrollzentrum · kostenlos &amp; Open Source"></li>
    </ul>
  </div>
  <div class="lid" style="left:880px; top:120px; width:600px; height:400px;">
    <svg class="glow" width="300" height="300" viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="150" fill="url(#halo)"/>
      <use href="#apple" x="95" y="92" width="110" height="110"/>
    </svg>
  </div>
  <div class="menu" style="left:1120px; top:430px; width:320px;"><img data-src="menu-{lang}-dark.png"></div>
  <div class="foot">github.com/TimKanik/apfellicht</div>
</section>

<!-- Vergleich -->
<section class="view compare" id="compare">
  <h2 data-en="Apple ties the logo to your screen. Apfellicht doesn't." data-de="Apple koppelt das Logo ans Display. Apfellicht nicht."></h2>
  <div class="sub" data-en="Measured on a MacBook Pro 14&quot; M5 Pro, macOS 27.2" data-de="Gemessen auf MacBook Pro 14&quot; M5 Pro, macOS 27.2"></div>

  <div class="panel" style="left:110px">
    <h3 data-en="Apple" data-de="Apple"></h3>
    <p class="note" data-en="Dim the screen, the logo dims with it." data-de="Display dunkler, Logo dunkler."></p>
    <div class="lids">
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)" opacity=".25"/><use href="#apple" x="15" y="14" width="24" height="24" opacity=".35"/></svg><small data-en="Screen 20 %" data-de="Display 20 %"></small></div>
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)" opacity=".6"/><use href="#apple" x="15" y="14" width="24" height="24" opacity=".7"/></svg><small data-en="Screen 60 %" data-de="Display 60 %"></small></div>
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)"/><use href="#apple" x="15" y="14" width="24" height="24"/></svg><small data-en="Screen 100 %" data-de="Display 100 %"></small></div>
    </div>
    <svg class="chart" id="chartApple" width="580" height="220"></svg>
  </div>

  <div class="panel" style="left:830px">
    <h3 data-en="Apfellicht" data-de="Apfellicht"></h3>
    <p class="note" data-en="Set it once. It stays." data-de="Einmal einstellen. Bleibt so."></p>
    <div class="lids">
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)" opacity=".8"/><use href="#apple" x="15" y="14" width="24" height="24" opacity=".9"/></svg><small data-en="Screen 20 %" data-de="Display 20 %"></small></div>
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)" opacity=".8"/><use href="#apple" x="15" y="14" width="24" height="24" opacity=".9"/></svg><small data-en="Screen 60 %" data-de="Display 60 %"></small></div>
      <div class="mini"><svg class="glow" viewBox="0 0 54 54"><circle cx="27" cy="27" r="27" fill="url(#halo)" opacity=".8"/><use href="#apple" x="15" y="14" width="24" height="24" opacity=".9"/></svg><small data-en="Screen 100 %" data-de="Display 100 %"></small></div>
    </div>
    <svg class="chart" id="chartMine" width="580" height="220"></svg>
  </div>
</section>

<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") || "en";
  document.documentElement.lang = lang;
  document.getElementById(q.get("view") || "hero").classList.add("on");
  for (const el of document.querySelectorAll("[data-en]")) el.innerHTML = el.dataset[lang];
  for (const img of document.querySelectorAll("img[data-src]")) img.src = "../docs/images/" + img.dataset.src.replace("{lang}", lang);

  // Apples Werkstabelle (Display-Nits → Logo-Nits), gemessen auf Mac17,13. Display bis 600 Nits gezeigt.
  const table = [[0,0],[0.1,12.5],[16.84,12.5],[34.12,28.62],[50,45.37],[69.11,65.52],[140,150],[300,300],[600,1000]];
  const W = 580, H = 220, L = 46, B = 34, T = 30, R = 10, maxX = 600, maxY = 1000;
  const sx = x => L + x / maxX * (W - L - R), sy = y => H - B - y / maxY * (H - B - T);
  function chart(id, points, label) {
    const s = document.getElementById(id);
    let g = `<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#4a4540"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#4a4540"/>`;
    for (const y of [0, 500, 1000]) g += `<text x="${L-8}" y="${sy(y)+5}" text-anchor="end">${y}</text>`;
    g += `<text x="${(L+W)/2}" y="${H-6}" text-anchor="middle">${lang === "de" ? "Displayhelligkeit (Nits)" : "Screen brightness (nits)"}</text>`;
    g += `<text x="${L}" y="14" text-anchor="middle">${lang === "de" ? "Logo (Nits)" : "Logo (nits)"}</text>`;
    const d = points.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="#ffc35e" stroke-width="4" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #ffb347)"/>`;
    if (label) g += `<text x="${W-R-6}" y="${sy(points[0][1])-12}" text-anchor="end" style="fill:#ffc35e;font-weight:600">${label}</text>`;
    s.innerHTML = g;
  }
  chart("chartApple", table);
  chart("chartMine", [[0, 640], [600, 640]], lang === "de" ? "dein Wert, z. B. 640 Nits" : "your value, e.g. 640 nits");
</script>
</body>
</html>
